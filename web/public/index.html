<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permutations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fatal" class="fatal" role="alert" hidden></div>
<script>
  window.addEventListener('error', function (e) {
    var f = document.getElementById('fatal');
    if (f && !document.querySelector('.app .pane')) { f.hidden = false; f.textContent = 'The app failed to start: ' + e.message; }
  });
</script>
<noscript><p class="fatal">Permutations needs JavaScript to draw the chart and run the examples.</p></noscript>
<main class="app">
  <section class="pane chart-pane" aria-labelledby="chart-title">
    <header class="pane-head">
      <h2 id="chart-title">Flow chart</h2>
      <span id="stale" class="badge warn" hidden>Last valid chart</span>
      <div class="tools" role="toolbar" aria-label="Chart tools">
        <button id="t-new" type="button" title="Add a new branch at the end of the code">New branch</button>
        <span class="sep" aria-hidden="true"></span>
        <button id="z-out" type="button" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="z-fit" type="button" title="Fit the chart to the pane">Fit</button>
        <button id="z-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
    </header>
    <div id="chart" class="chart-scroll" tabindex="-1"></div>
    <p id="chart-hints" class="hint warn-hint" role="status" hidden></p>
    <div id="selbar" class="selbar" role="region" aria-label="Selection"><p class="selbar-hint">Click any box to select it. Its actions appear here. Double-click text to edit it. <button id="b-keys" type="button" class="linkish">Mouse and keyboard</button></p></div>
  </section>

  <section class="pane code-pane" aria-labelledby="code-title">
    <header class="pane-head">
      <h2 id="code-title">Code</h2>
      <div class="tools">
        <button id="b-help" type="button" aria-expanded="false" aria-controls="help">Help</button>
        <button id="b-expand" type="button" title="Write every branch in long form, one piece per line">Long form</button>
        <button id="b-collapse" type="button" title="Write every branch in short form, on one line where it fits">Short form</button>
        <button id="b-reset" type="button" title="Replace the code with the example program (you can undo)">Example</button>
        <button id="b-share" type="button" class="primary">Share</button>
      </div>
    </header>
    <div class="editor-wrap">
      <div id="editor" class="editor"></div>
      <aside id="help" class="help" aria-label="Help" hidden>
        <header><h3>Help</h3><button id="help-close" type="button">Close</button></header>
        <p class="note">Insert puts the snippet at the cursor in the code.</p>
        <ul id="help-list"></ul>
        <h4 id="help-keys-title">Chart: mouse and keyboard</h4>
        <table class="keys"><tbody id="help-keys"></tbody></table>
      </aside>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="notice-close" type="button" aria-label="Dismiss message">Dismiss</button></div>
    <div id="error" class="error" role="alert" aria-live="assertive" hidden></div>
  </section>

  <section class="pane ex-pane" aria-labelledby="ex-title">
    <header class="pane-head">
      <h2 id="ex-title">Examples</h2>
      <span id="ex-stale" class="badge warn" hidden title="The code has an error, so these come from the last code that worked">Last valid code</span>
      <div class="tabs" role="tablist" aria-label="Example view">
        <button id="tab-random" type="button" role="tab" aria-selected="true">Random 5</button>
        <button id="tab-all" type="button" role="tab" aria-selected="false">All</button>
      </div>
      <p class="count" aria-live="polite"><strong id="count">0</strong> <span id="count-unit">permutations</span></p>
    </header>
    <div id="view-random" class="ex-body">
      <ol id="samples" class="samples"></ol>
      <p id="trace-note" class="trace-note" role="status" hidden><span id="trace-text"></span> <button id="trace-stop" type="button" class="linkish">Stop showing</button></p>
      <div class="ex-foot"><button id="b-new" type="button" class="primary">Make a new 5</button><span id="sample-note" class="note"></span></div>
    </div>
    <div id="view-all" class="ex-body" hidden>
      <div id="all-intro" class="all-intro"></div>
      <ol id="all-list" class="samples all"></ol>
      <p id="all-note" class="note"></p>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
